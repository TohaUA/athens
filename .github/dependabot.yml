---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 2
    target-branch: main
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 2
    target-branch: main
  - package-ecosystem: docker
    directories:
      - /cmd/proxy
    schedule:
      interval: daily
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 2
    target-branch: main
